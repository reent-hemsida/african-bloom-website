<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer login — Africane Bloom</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="shop.css">
</head>
<body>
<div id="sh-header"></div>

<main class="sh-main sh-narrow">
  <h1 data-i18n="l_title">Customer login</h1>
  <p class="sh-lead" data-i18n="l_lead"></p>
  <div id="msg" style="margin-top:24px;"></div>

  <section id="v-loading"><p data-i18n="c_loading">Loading…</p></section>

  <section id="v-off" hidden>
    <div class="sh-banner warn" data-i18n="l_off"></div>
  </section>

  <!-- not logged in -->
  <section id="v-auth" hidden>
    <div class="sh-tabs" role="tablist">
      <button type="button" id="tab-login" class="on" data-i18n="l_tab_login"></button>
      <button type="button" id="tab-reg" data-i18n="l_tab_reg"></button>
    </div>

    <form id="f-login" class="sh-form sh-card" novalidate>
      <label><span class="lbl" data-i18n="l_email"></span><input type="email" name="email" autocomplete="username" required></label>
      <label><span class="lbl" data-i18n="l_pw"></span><input type="password" name="password" autocomplete="current-password" required></label>
      <p style="margin:22px 0 0;"><button class="btn" type="submit" data-i18n="l_btn_login"></button></p>
      <p style="margin:18px 0 0; font-size:15px;"><button type="button" class="linkbtn" id="show-forgot" data-i18n="l_forgot"></button></p>
    </form>

    <form id="f-forgot" class="sh-form sh-card" novalidate hidden>
      <label><span class="lbl" data-i18n="l_email"></span><input type="email" name="email" autocomplete="username" required></label>
      <p style="margin:22px 0 0;"><button class="btn" type="submit" data-i18n="l_reset_btn"></button></p>
      <p style="margin:18px 0 0; font-size:15px;"><button type="button" class="linkbtn" id="back-login" data-i18n="l_tab_login"></button></p>
    </form>

    <form id="f-reg" class="sh-form sh-card" novalidate hidden>
      <label><span class="lbl" data-i18n="l_company"></span><input type="text" name="company" autocomplete="organization" maxlength="200" required></label>
      <label><span class="lbl" data-i18n="l_name"></span><input type="text" name="contact_name" autocomplete="name" maxlength="200" required></label>
      <div class="sh-row2">
        <label><span class="lbl" data-i18n="l_phone"></span><input type="tel" name="phone" autocomplete="tel" maxlength="60"></label>
        <label><span class="lbl" data-i18n="l_country"></span><input type="text" name="country" autocomplete="country-name" maxlength="80" required></label>
      </div>
      <label><span class="lbl" data-i18n="l_vat"></span><input type="text" name="vat_no" maxlength="60"></label>
      <label><span class="lbl" data-i18n="l_email"></span><input type="email" name="email" autocomplete="email" required></label>
      <div class="sh-row2">
        <label><span class="lbl" data-i18n="l_pw"></span><input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
        <label><span class="lbl" data-i18n="l_pw2"></span><input type="password" name="password2" autocomplete="new-password" minlength="8" required></label>
      </div>
      <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute; left:-9999px; width:1px; height:1px; opacity:0;">
      <label class="sh-check"><input type="checkbox" name="consent" required><span data-i18n-html="l_consent"></span></label>
      <p style="margin:22px 0 0;"><button class="btn" type="submit" data-i18n="l_btn_reg"></button></p>
    </form>
  </section>

  <!-- logged in, status pending / rejected / approved -->
  <section id="v-status" hidden>
    <div class="sh-card">
      <h2 id="st-title"></h2>
      <p id="st-text" style="margin:12px 0 0;"></p>
      <p style="margin:22px 0 0; display:flex; gap:12px; flex-wrap:wrap;">
        <a class="btn" id="st-go" href="shop.html" hidden data-i18n="l_go_shop"></a>
        <a class="btn ghost" id="st-admin" href="admin.html" hidden data-i18n="c_admin"></a>
        <button class="btn ghost" type="button" id="st-out" data-i18n="c_logout"></button>
      </p>
    </div>
  </section>

  <!-- arrived through a password reset e-mail -->
  <section id="v-recovery" hidden>
    <form id="f-newpw" class="sh-form sh-card" novalidate>
      <h2 data-i18n="l_newpw"></h2>
      <label><span class="lbl" data-i18n="l_newpw"></span><input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
      <label><span class="lbl" data-i18n="l_pw2"></span><input type="password" name="password2" autocomplete="new-password" minlength="8" required></label>
      <p style="margin:22px 0 0;"><button class="btn" type="submit" data-i18n="l_newpw_btn"></button></p>
    </form>
  </section>
</main>

<div id="sh-footer"></div>

<script src="varieties-data.js"></script>
<script src="shop-config.js"></script>
<script src="shop-core.js"></script>

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var msg = $('msg');
  var secs = ['v-loading', 'v-off', 'v-auth', 'v-status', 'v-recovery'];
  function show(id) { secs.forEach(function (s) { $(s).hidden = s !== id; }); }
  function banner(kind, key) {
    msg.innerHTML = key ? '<div class="sh-banner ' + kind + '">' + AB.esc(AB.t(key)) + '</div>' : '';
    msg.setAttribute('data-key', key || ''); msg.setAttribute('data-kind', kind || '');
  }
  AB.onLang(function () { var k = msg.getAttribute('data-key'); if (k) banner(msg.getAttribute('data-kind'), k); renderStatus(); });
  function errKey(e) {
    return { invalid_credentials: 'l_err_creds', email_not_confirmed: 'l_err_confirm', weak_password: 'l_err_weak', rate_limit: 'l_err_rate' }[e && e.code] || 'c_error';
  }
  function nextUrl() {
    var m = /[?&]next=([a-z\-]+\.html)\b/.exec(location.search);
    return m ? m[1] : 'shop.html';
  }
  function busy(form, on) { form.querySelectorAll('button[type=submit]').forEach(function (b) { b.disabled = on; }); }

  function renderStatus() {
    var p = AB.profile;
    if (!AB.user || !p) return;
    var k = p.status === 'approved' ? 'approved' : p.status === 'rejected' ? 'rejected' : 'pending';
    $('st-title').textContent = AB.t('l_' + k + '_title');
    $('st-text').textContent = AB.t('l_' + k);
    $('st-go').hidden = k !== 'approved';
    $('st-admin').hidden = !p.is_admin;
  }

  function route() {
    banner('', '');
    if (AB.mode === 'off') { show('v-off'); return; }
    if (AB.backend.isRecovery()) { show('v-recovery'); return; }
    if (AB.user && AB.profile) {
      if (AB.profile.status === 'approved' && /[?&]next=/.test(location.search)) { location.replace(nextUrl()); return; }
      renderStatus(); show('v-status'); return;
    }
    show('v-auth');
  }

  AB.active = 'login';
  AB.init().then(function () { AB.renderShell('login'); route(); }).catch(function () { show('v-off'); banner('err', 'c_error'); });

  /* tabs */
  function tab(which) {
    $('f-login').hidden = which !== 'login';
    $('f-reg').hidden = which !== 'reg';
    $('f-forgot').hidden = which !== 'forgot';
    $('tab-login').classList.toggle('on', which !== 'reg');
    $('tab-reg').classList.toggle('on', which === 'reg');
    banner('', '');
  }
  $('tab-login').onclick = function () { tab('login'); };
  $('tab-reg').onclick = function () { tab('reg'); };
  $('show-forgot').onclick = function () { tab('forgot'); };
  $('back-login').onclick = function () { tab('login'); };
  $('st-out').onclick = function () { AB.logout(); };

  /* login */
  $('f-login').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, email = f.email.value.trim(), pw = f.password.value;
    if (!email || !pw) { banner('err', 'l_err_req'); return; }
    busy(f, true);
    AB.backend.signIn(email, pw).then(function () { return AB.refresh(); }).then(function () {
      f.password.value = '';
      if (AB.profile && AB.profile.status === 'approved') { location.href = nextUrl(); return; }
      route();
    }).catch(function (er) { banner('err', errKey(er)); }).then(function () { busy(f, false); });
  });

  /* forgot password */
  $('f-forgot').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, email = f.email.value.trim();
    if (!email) { banner('err', 'l_err_req'); return; }
    busy(f, true);
    AB.backend.resetPassword(email).then(function () { banner('ok', 'l_reset_sent'); })
      .catch(function (er) { banner('err', errKey(er)); }).then(function () { busy(f, false); });
  });

  /* register */
  $('f-reg').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    if (f.website.value) return; /* honeypot */
    var v = {
      company: f.company.value.trim(), contact_name: f.contact_name.value.trim(), phone: f.phone.value.trim(),
      country: f.country.value.trim(), vat_no: f.vat_no.value.trim(), email: f.email.value.trim()
    };
    if (!v.company || !v.contact_name || !v.country || !v.email || !f.consent.checked) { banner('err', 'l_err_req'); return; }
    if (f.password.value.length < 8) { banner('err', 'l_err_weak'); return; }
    if (f.password.value !== f.password2.value) { banner('err', 'l_err_mismatch'); return; }
    busy(f, true);
    var meta = { company: v.company, contact_name: v.contact_name, phone: v.phone, country: v.country, vat_no: v.vat_no, lang: AB.lang() };
    AB.backend.signUp(v.email, f.password.value, meta).then(function () {
      AB.notify('New customer awaiting approval: ' + v.company, {
        company: v.company, contact: v.contact_name, email: v.email, phone: v.phone, country: v.country, vat_no: v.vat_no,
        message: 'A new customer has registered on the webshop and awaits approval. Open admin.html to approve.'
      });
      f.reset(); tab('login'); banner('ok', 'l_reg_ok');
    }).catch(function (er) { banner('err', errKey(er)); }).then(function () { busy(f, false); });
  });

  /* new password after reset link */
  $('f-newpw').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    if (f.password.value.length < 8) { banner('err', 'l_err_weak'); return; }
    if (f.password.value !== f.password2.value) { banner('err', 'l_err_mismatch'); return; }
    busy(f, true);
    AB.backend.updatePassword(f.password.value).then(function () {
      banner('ok', 'l_newpw_ok');
      return AB.backend.signOut();
    }).then(function () { history.replaceState(null, '', location.pathname); AB.user = null; AB.profile = null; AB.renderShell(); show('v-auth'); tab('login'); banner('ok', 'l_newpw_ok'); })
      .catch(function (er) { banner('err', errKey(er)); }).then(function () { busy(f, false); });
  });
})();
</script>
</body>
</html>
