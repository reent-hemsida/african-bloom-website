<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webshop — Africane Bloom</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B9%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="shop.css">
</head>
<body>
<div id="sh-header"></div>

<main class="sh-main">
  <section id="v-loading"><p data-i18n="c_loading">Loading…</p></section>

  <section id="v-blocked" hidden>
    <h1 data-i18n="s_title">Webshop</h1>
    <div class="sh-banner warn" id="blocked-msg" style="margin-top:24px;"></div>
    <p><a class="btn" href="login.html" data-i18n="c_login">Log in</a></p>
  </section>

  <section id="v-shop" hidden>
    <h1 data-i18n="s_title">Webshop</h1>
    <p class="sh-lead" id="lead"></p>

    <div class="sh-tabs" style="margin-top:26px;">
      <button type="button" id="tab-cat" class="on" data-i18n="s_tab_cat"></button>
      <button type="button" id="tab-orders" data-i18n="s_tab_orders"></button>
    </div>

    <!-- catalogue + cart -->
    <div id="pane-cat" class="sh-shop">
      <div>
        <div class="sh-filters sh-form">
          <input type="search" class="sh-in" id="f-q" data-i18n-ph="s_search" style="margin-top:0;">
          <select class="sh-in" id="f-cat" style="margin-top:0;"></select>
          <select class="sh-in" id="f-col" style="margin-top:0;"></select>
        </div>
        <label class="sh-check" style="margin-top:8px;"><input type="checkbox" id="f-priced"><span data-i18n="s_priced_only"></span></label>
        <div class="sh-count" id="count"></div>
        <div class="sh-grid" id="grid"></div>
        <div class="sh-more"><button class="btn ghost" type="button" id="more" hidden data-i18n="s_more"></button></div>
      </div>

      <aside class="sh-cart" id="cart" aria-label="Order request">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h2 data-i18n="s_cart"></h2>
          <button type="button" class="linkbtn" id="cart-close" data-i18n="s_close"></button>
        </div>
        <div id="cart-body"></div>
      </aside>
      <button type="button" class="sh-fab" id="fab"><span data-i18n="s_cart"></span><span id="fab-n"></span></button>
    </div>

    <!-- my orders -->
    <div id="pane-orders" hidden></div>
  </section>
</main>

<div id="sh-footer"></div>

<script src="varieties-data.js"></script>
<script src="shop-config.js"></script>
<script src="shop-core.js"></script>

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var t = AB.t, esc = AB.esc;
  var cat = null, shown = 48, filtered = [], addedFlash = {};
  var HEAD_KEY = { standard: 's_head_standard', large: 's_head_large', xlarge: 's_head_xlarge' };

  function show(id) { ['v-loading', 'v-blocked', 'v-shop'].forEach(function (s) { $(s).hidden = s !== id; }); }

  /* ---------- boot ---------- */
  AB.active = 'shop.html';
  AB.init().then(function () {
    AB.renderShell('shop.html');
    if (AB.mode === 'off') { $('blocked-msg').textContent = t('s_blocked_off'); show('v-blocked'); return; }
    if (!AB.user) { location.replace('login.html?next=shop.html'); return; }
    var p = AB.profile;
    if (!p || (p.status !== 'approved' && !p.is_admin)) {
      $('blocked-msg').textContent = t(p && p.status === 'rejected' ? 's_blocked_rejected' : 's_blocked_pending');
      show('v-blocked'); return;
    }
    return AB.backend.catalog().then(function (c) {
      cat = c; show('v-shop'); buildFilters(); renderAll();
    });
  }).catch(function () { $('blocked-msg').textContent = t('c_error'); show('v-blocked'); });

  AB.onLang(function () {
    if (!cat) { var b = $('blocked-msg'); return; }
    buildFilters(); renderAll();
  });

  /* ---------- filters ---------- */
  var fState = { q: '', cat: '', col: '', priced: false };
  function buildFilters() {
    var fc = $('f-cat'), fo = $('f-col');
    var present = {};
    AB.varieties.forEach(function (v) { present[v.cat] = true; });
    fc.innerHTML = '<option value="">' + esc(t('s_all_cats')) + '</option>' +
      Object.keys(AB.catLabels()).filter(function (k) { return present[k]; }).map(function (k) {
        return '<option value="' + k + '"' + (fState.cat === k ? ' selected' : '') + '>' + esc(AB.catLabel(k)) + '</option>';
      }).join('');
    fo.innerHTML = '<option value="">' + esc(t('s_all_colors')) + '</option>' +
      AB.colourLabels().map(function (c, i) {
        return '<option value="' + i + '"' + (fState.col === String(i) ? ' selected' : '') + '>' + esc(c) + '</option>';
      }).join('');
    $('f-q').value = fState.q;
    $('f-priced').checked = fState.priced;
    var minTier = Infinity;
    Object.keys(cat.byGroup).forEach(function (g) { minTier = Math.min(minTier, cat.byGroup[g].minTier); });
    $('lead').textContent = t('s_lead', { min: AB.fmtInt(isFinite(minTier) ? minTier : 5000) });
  }
  var qTimer = null;
  $('f-q').addEventListener('input', function () { clearTimeout(qTimer); var v = this.value; qTimer = setTimeout(function () { fState.q = v; shown = 48; renderGrid(); }, 150); });
  $('f-cat').addEventListener('change', function () { fState.cat = this.value; shown = 48; renderGrid(); });
  $('f-col').addEventListener('change', function () { fState.col = this.value; shown = 48; renderGrid(); });
  $('f-priced').addEventListener('change', function () { fState.priced = this.checked; shown = 48; renderGrid(); });
  $('more').addEventListener('click', function () { shown += 48; renderGrid(); });

  /* ---------- tabs ---------- */
  function tab(which) {
    $('pane-cat').hidden = which !== 'cat';
    $('pane-orders').hidden = which !== 'orders';
    $('tab-cat').classList.toggle('on', which === 'cat');
    $('tab-orders').classList.toggle('on', which === 'orders');
    if (which === 'orders') renderOrders();
  }
  $('tab-cat').onclick = function () { tab('cat'); };
  $('tab-orders').onclick = function () { tab('orders'); };

  /* ---------- grid ---------- */
  var groupPriceCache = {};
  function groupRange(g) {
    if (groupPriceCache[g]) return groupPriceCache[g];
    var info = cat.byGroup[g], lo = Infinity, hi = 0;
    cat.rows.forEach(function (r) {
      if (r.price_group === g && r.head_size === 'standard' && r.tier_qty === info.minTier) { lo = Math.min(lo, r.price_ex_vat); hi = Math.max(hi, r.price_ex_vat); }
    });
    return (groupPriceCache[g] = { lo: lo, hi: hi, q: info.minTier });
  }
  function applyFilters() {
    var q = fState.q.trim().toLowerCase();
    filtered = AB.varieties.filter(function (v) {
      if (fState.cat && v.cat !== fState.cat) return false;
      if (fState.col !== '' && String(v.colour) !== fState.col) return false;
      if (fState.priced && !AB.groupInfo(cat, v.name)) return false;
      if (q && v.name.toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }
  function cardHTML(v, i) {
    var gi = AB.groupInfo(cat, v.name), price;
    if (gi) {
      var r = groupRange(gi.group);
      price = '<div class="pr">' + esc(t('s_from', { a: AB.fmt(r.lo), b: AB.fmt(r.hi) })) + '<br><span class="mt">' + esc(t('s_from_q', { q: AB.fmtInt(r.q) })) + '</span></div>';
    } else price = '<div class="pr req">' + esc(t('s_req')) + '</div>';
    var heads = AB.headsFor(cat, v.name), lens = AB.lengthsFor(cat, v.name, heads[0]);
    var meta = [AB.catLabel(v.cat), AB.colourLabel(v.colour)].filter(Boolean).join(' · ');
    return '<div class="sh-v" data-i="' + i + '">' +
      '<img loading="lazy" src="' + esc(v.photo) + '" alt="' + esc(v.name) + '">' +
      '<div class="in"><div class="nm">' + esc(v.name) + '</div><div class="mt">' + esc(meta) + '</div>' + price +
      '<div class="ctl">' +
      (heads.length > 1 ? '<select class="head full" aria-label="' + esc(t('s_head')) + '">' + heads.map(function (h) { return '<option value="' + h + '">' + esc(t(HEAD_KEY[h])) + '</option>'; }).join('') + '</select>' : '') +
      '<select class="len" aria-label="' + esc(t('s_length')) + '">' + lens.map(function (l) { return '<option value="' + l + '"' + (l === 50 ? ' selected' : '') + '>' + l + ' ' + esc(t('c_cm')) + '</option>'; }).join('') + '</select>' +
      '<input class="qty" type="number" inputmode="numeric" min="1" step="1" placeholder="' + esc(t('s_qty')) + '" aria-label="' + esc(t('s_qty')) + '">' +
      '<button type="button" class="btn small full add">' + esc(addedFlash[v.name] ? t('s_added') : t('s_add')) + '</button>' +
      '</div></div></div>';
  }
  function renderGrid() {
    applyFilters();
    var part = filtered.slice(0, shown);
    $('grid').innerHTML = part.length ? part.map(function (v, i) { return cardHTML(v, i); }).join('') : '<p>' + esc(t('s_nothing')) + '</p>';
    $('count').textContent = t('s_count', { n: AB.fmtInt(filtered.length) });
    $('more').hidden = filtered.length <= shown;
  }
  $('grid').addEventListener('change', function (e) {
    if (!e.target.classList.contains('head')) return;
    var card = e.target.closest('.sh-v'), v = filtered[+card.getAttribute('data-i')];
    var lens = AB.lengthsFor(cat, v.name, e.target.value), sel = card.querySelector('.len'), cur = +sel.value;
    sel.innerHTML = lens.map(function (l) { return '<option value="' + l + '"' + (l === cur ? ' selected' : '') + '>' + l + ' ' + esc(t('c_cm')) + '</option>'; }).join('');
  });
  $('grid').addEventListener('click', function (e) {
    if (!e.target.classList.contains('add')) return;
    var card = e.target.closest('.sh-v'), v = filtered[+card.getAttribute('data-i')];
    var qtyEl = card.querySelector('.qty'), qty = parseInt(qtyEl.value, 10);
    if (!(qty >= 1)) { qtyEl.focus(); return; }
    var headEl = card.querySelector('.head');
    AB.cart.add({ variety: v.name, category: v.cat, head: headEl ? headEl.value : 'standard', len: +card.querySelector('.len').value, qty: Math.min(qty, 1000000) });
    qtyEl.value = '';
    e.target.textContent = t('s_added');
    setTimeout(function () { e.target.textContent = t('s_add'); }, 1200);
    renderCart();
  });

  /* ---------- cart ---------- */
  var cartMsg = '', cartDone = null, placing = false;
  function renderCart() {
    var c = AB.cart.get(), body = $('cart-body');
    $('fab-n').textContent = c.length ? ' · ' + AB.fmtInt(c.reduce(function (a, i) { return a + i.qty; }, 0)) + ' ' + t('c_stems') : '';
    if (cartDone) {
      body.innerHTML = '<div class="sh-banner ok"><b>' + esc(t('s_ok_title')) + '</b><p style="margin:8px 0 0;">' + esc(t('s_ok_text', { no: cartDone })) + '</p></div>' +
        '<button type="button" class="btn ghost" id="again">' + esc(t('s_ok_again')) + '</button>';
      $('again').onclick = function () { cartDone = null; renderCart(); $('cart').classList.remove('open'); };
      return;
    }
    if (!c.length) { body.innerHTML = '<p class="sh-muted">' + esc(t('s_cart_empty')) + '</p>'; return; }
    var calc = AB.calcCart(cat, c), tot = calc.totals, min = cat.minStems;
    var html = calc.lines.map(function (l, i) {
      var it = l.item;
      var head = it.head !== 'standard' ? ' · ' + t(HEAD_KEY[it.head]) : '';
      var price = l.lineEx === null ? t('s_line_req') : 'SEK ' + AB.fmt(l.lineEx);
      var unit = l.unitEx === null ? '' : ' · ' + AB.fmt(l.unitEx) + ' ' + t('s_unit');
      return '<div class="sh-line"><span class="nm">' + esc(it.variety) + '</span><span>' + esc(price) + '</span>' +
        '<span class="sub">' + esc(it.len + ' ' + t('c_cm') + head + unit) + '</span>' +
        '<span class="sub"><input type="number" class="cq" data-i="' + i + '" min="1" step="1" value="' + it.qty + '" style="width:110px; padding:5px 8px; border:1px solid #D9C7B3;" aria-label="' + esc(t('s_qty')) + '"> ' + esc(t('c_stems')) +
        ' &nbsp; <button type="button" class="rm" data-i="' + i + '">' + esc(t('s_remove')) + '</button></span></div>';
    }).join('');
    html += calc.hints.map(function (h) {
      return '<div class="sh-hint">' + esc(t(h.first ? 's_hint_first' : 's_hint', { variety: h.variety, have: AB.fmtInt(h.have), more: AB.fmtInt(h.next - h.have), next: AB.fmtInt(h.next) })) + '</div>';
    }).join('');
    html += '<div class="sh-totals">' +
      '<div><span>' + esc(t('s_total_stems')) + '</span><span>' + AB.fmtInt(tot.stems) + '</span></div>' +
      '<div><span>' + esc(t('s_total_ex')) + '</span><span>SEK ' + AB.fmt(tot.ex) + '</span></div>' +
      '<div><span>' + esc(t('s_vat', { p: AB.fmtInt(tot.vatPct) })) + '</span><span>SEK ' + AB.fmt(tot.vat) + '</span></div>' +
      '<div class="big"><span>' + esc(t('s_total_inc')) + '</span><span>SEK ' + AB.fmt(tot.inc) + '</span></div></div>' +
      '<p class="sh-muted" style="margin:8px 0 0;">' + esc(t('s_vat_note')) + '</p>';
    if (tot.unpriced) html += '<p class="sh-muted" style="margin:10px 0 0;">' + esc(t('s_unpriced', { n: tot.unpriced })) + '</p>';
    var below = min && tot.stems < min;
    if (below) html += '<div class="sh-banner warn" style="margin-top:12px;">' + esc(t('s_min_warn', { min: AB.fmtInt(min), have: AB.fmtInt(tot.stems) })) + '</div>';
    if (cartMsg) html += '<div class="sh-banner err" style="margin-top:12px;">' + esc(cartMsg) + '</div>';
    html += '<div class="sh-form"><label><span class="lbl">' + esc(t('s_note')) + '</span><textarea id="o-note" maxlength="2000"></textarea></label>' +
      '<label><span class="lbl">' + esc(t('s_delivery')) + '</span><textarea id="o-del" maxlength="500"></textarea></label></div>' +
      '<p style="margin:18px 0 0;"><button type="button" class="btn" id="place"' + (below || placing ? ' disabled' : '') + '>' + esc(placing ? t('s_placing') : t('s_place')) + '</button></p>';
    // keep typed notes while the cart re-renders
    var oldN = $('o-note') ? $('o-note').value : '', oldD = $('o-del') ? $('o-del').value : '';
    body.innerHTML = html;
    $('o-note').value = oldN; $('o-del').value = oldD;
    $('place').onclick = place;
  }
  $('cart-body').addEventListener('click', function (e) {
    if (e.target.classList.contains('rm')) { AB.cart.remove(+e.target.getAttribute('data-i')); cartMsg = ''; renderCart(); }
  });
  $('cart-body').addEventListener('change', function (e) {
    if (!e.target.classList.contains('cq')) return;
    var c = AB.cart.get(), i = +e.target.getAttribute('data-i'), q = parseInt(e.target.value, 10);
    if (!c[i]) return;
    if (q >= 1) c[i].qty = Math.min(q, 1000000); else c.splice(i, 1);
    AB.cart.set(c); cartMsg = ''; renderCart();
  });
  $('fab').onclick = function () { $('cart').classList.add('open'); };
  $('cart-close').onclick = function () { $('cart').classList.remove('open'); };

  function place() {
    var c = AB.cart.get();
    if (!c.length || placing) return;
    var note = $('o-note').value.trim(), del = $('o-del').value.trim();
    var items = c.map(function (i) { return { variety: i.variety, category: i.category, head_size: i.head, length_cm: i.len, qty: i.qty }; });
    var calc = AB.calcCart(cat, c);
    placing = true; cartMsg = ''; renderCart();
    $('o-note').value = note; $('o-del').value = del;
    AB.backend.placeOrder(items, note, del).then(function (res) {
      var p = AB.profile || {};
      var lines = calc.lines.map(function (l) {
        return '- ' + l.item.variety + ' | ' + l.item.head + ' | ' + l.item.len + ' cm | ' + l.item.qty + ' stems | ' + (l.lineEx === null ? 'price on request' : 'SEK ' + l.lineEx.toFixed(2) + ' ex VAT');
      }).join('\n');
      AB.notify('New order request #' + res.order_no + ' from ' + (p.company || AB.user.email), {
        order_no: String(res.order_no), company: p.company || '', contact: p.contact_name || '', email: AB.user.email, phone: p.phone || '',
        total_ex_vat: 'SEK ' + Number(res.total_ex_vat).toFixed(2), unpriced_lines: String(res.unpriced_lines),
        delivery: del, note: note, message: lines
      });
      AB.cart.clear(); cartDone = res.order_no; placing = false; renderCart();
    }).catch(function (er) {
      placing = false;
      cartMsg = er.code === 'below_minimum' ? t('s_err_min', { min: AB.fmtInt(er.extra || cat.minStems) }) : er.code === 'not_approved' ? t('s_err_na') : t('c_error');
      renderCart();
      $('o-note').value = note; $('o-del').value = del;
    });
  }

  /* ---------- my orders ---------- */
  function renderOrders() {
    var pane = $('pane-orders');
    pane.innerHTML = '<p>' + esc(t('c_loading')) + '</p>';
    AB.backend.myOrders(AB.user.id).then(function (orders) {
      if (!orders.length) { pane.innerHTML = '<p>' + esc(t('s_no_orders')) + '</p>'; return; }
      pane.innerHTML = orders.map(function (o) {
        var items = o.order_items || [];
        return '<details class="sh-order"><summary><b>' + esc(t('s_order')) + ' ' + esc(o.order_no) + '</b><span class="sh-muted">' + esc(AB.fmtDate(o.created_at)) + '</span>' +
          '<span class="pill ' + esc(o.status) + '">' + esc(t('s_status_' + o.status)) + '</span>' +
          '<span style="margin-left:auto;">SEK ' + esc(AB.fmt(o.total_ex_vat)) + ' <span class="sh-muted">' + esc(t('s_vat_hint')) + '</span></span></summary><div>' +
          '<div class="sh-scroll"><table class="sh-table"><thead><tr><th>' + esc(t('s_items')) + '</th><th class="num">' + esc(t('c_cm')) + '</th><th class="num">' + esc(t('c_stems')) + '</th><th class="num">SEK</th></tr></thead><tbody>' +
          items.map(function (it) {
            return '<tr><td>' + esc(it.variety) + (it.head_size !== 'standard' ? ' <span class="sh-muted">· ' + esc(t(HEAD_KEY[it.head_size])) + '</span>' : '') + '</td><td class="num">' + esc(it.length_cm) + '</td><td class="num">' + esc(AB.fmtInt(it.qty)) +
              '</td><td class="num">' + (it.line_ex_vat === null ? esc(t('s_line_req')) : esc(AB.fmt(it.line_ex_vat))) + '</td></tr>';
          }).join('') + '</tbody></table></div>' +
          (o.note ? '<p class="sh-pre sh-muted">' + esc(o.note) + '</p>' : '') +
          (o.delivery_note ? '<p class="sh-pre sh-muted">' + esc(o.delivery_note) + '</p>' : '') + '</div></details>';
      }).join('');
    }).catch(function () { pane.innerHTML = '<div class="sh-banner err">' + esc(t('c_error')) + '</div>'; });
  }

  function renderAll() { renderGrid(); renderCart(); if (!$('pane-orders').hidden) renderOrders(); }
})();
</script>
</body>
</html>
